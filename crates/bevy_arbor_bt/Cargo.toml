# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_arbor_bt"
description = "Reactive behaviour trees for Bevy: trees that sleep until something they wait on changes, tasks as entities"
readme = "./README.md"
keywords = ["bevy", "ai", "behaviour-tree", "game"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The tree macro
bevy_arbor_macros = { workspace = true, features = [] }

# Game engine
bevy = { workspace = true, features = ["std", "bevy_log"] }

[dev-dependencies]
bevy_harness = { workspace = true }

# What guards cost: `cargo run --release -p bevy_arbor_bt --example load`.
[[example]]
name = "load"
test = false

[lints]
workspace = true
