# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_arbor_avian3d"
description = "bevy_arbor perception with avian3d: line of sight and touch from contacts"
readme = "../bevy_arbor_avian/README.md"
keywords = ["bevy", "ai", "perception", "avian"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# One source for 2D and 3D, as avian's own crates and lightyear's are. Its
# dimension comes from `build.rs`, not a feature, so it can't be turned off.
build = "build.rs"

[lib]
name = "bevy_arbor_avian3d"
path = "../bevy_arbor_avian/src/lib.rs"

[features]
default = ["parry-f32"]
# avian's single-precision collider backend. For double precision, turn off
# default features and enable `parry-f64` on your own avian dependency: the
# two can't both be on, so it isn't a feature here.
parry-f32 = ["avian3d/parry-f32"]
# Line of sight as an environment query test: `LineOfSight`
eqs = ["dep:bevy_arbor_eqs"]

[dependencies]
# The part it extends
bevy_arbor_perception = { workspace = true, features = [] }
bevy_arbor_eqs = { workspace = true, optional = true, features = [] }

# Physics
avian3d = { workspace = true, features = ["3d"] }

# Game engine
bevy = { workspace = true, features = ["std"] }

[dev-dependencies]
bevy_harness = { workspace = true }

[lints]
workspace = true
