# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_arbor_eqs"
description = "Environment queries for Bevy AI: generate places and things, filter and score them, and pick the best for an agent"
readme = "./README.md"
keywords = ["bevy", "ai", "eqs", "game"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The parts it runs with: trees run queries as tasks, and perception gives
# the space and what agents perceive
bevy_arbor_bt = { workspace = true, features = [] }
bevy_arbor_perception = { workspace = true, features = [] }

# Game engine
bevy = { workspace = true, features = ["std", "bevy_log"] }

[dev-dependencies]
bevy_harness = { workspace = true }

[lints]
workspace = true
