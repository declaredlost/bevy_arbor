# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/bevy_arbor",
    "./crates/bevy_arbor_avian2d",
    "./crates/bevy_arbor_avian3d",
    "./crates/bevy_arbor_bt",
    "./crates/bevy_arbor_macros",
    "./crates/bevy_arbor_perception",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

authors = ["Oleh Martsokha <o.martsokha@gmail.com>"]
repository = "https://github.com/declaredlost/bevy_arbor"
documentation = "https://docs.rs/bevy_arbor"

# Shared lints for every crate (opt in with `[lints] workspace = true`).
# The whole of `clippy::pedantic` is denied.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Lint exceptions are `#[expect]`s with a reason, so stale ones are reported.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Bevy systems take `Res`, `Query` and `Commands` by value by design.
needless_pass_by_value = "allow"
# Bevy systems naturally have many resource params and complex `Query`
# types: these lints fire on idiomatic Bevy code, so they're allowed
# workspace-wide rather than per system.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Internal crates
# Without their default `parry-f32`, so what depends on them leaves avian's
# collider backend to the game.
bevy_arbor_avian2d = { path = "./crates/bevy_arbor_avian2d", version = "0.1.0", default-features = false }
bevy_arbor_avian3d = { path = "./crates/bevy_arbor_avian3d", version = "0.1.0", default-features = false }
bevy_arbor_bt = { path = "./crates/bevy_arbor_bt", version = "0.1.0" }
bevy_arbor_macros = { path = "./crates/bevy_arbor_macros", version = "0.1.0" }
bevy_arbor_perception = { path = "./crates/bevy_arbor_perception", version = "0.1.0" }

# Game engine (headless by default)
bevy = { version = "0.20", default-features = false, features = ["std"] }

# Physics, for the avian integration: no features by default, so the game
# chooses avian's own
avian2d = { version = "0.8", default-features = false }
avian3d = { version = "0.8", default-features = false }

# Testing
bevy_harness = { git = "https://github.com/declaredlost/bevy_harness", version = "0.1.0" }

# Proc macros
proc-macro-crate = { version = "3.5", features = [] }
proc-macro2 = { version = "1.0", features = [] }
quote = { version = "1.0", features = [] }
syn = { version = "3.0", features = [] }

# Development: compile our code with light optimizations for fast iteration,
# and dependencies (Bevy) fully optimized so tests run quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
